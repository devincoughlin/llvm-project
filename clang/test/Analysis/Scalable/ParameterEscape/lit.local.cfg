# Shared spelling of the three pipeline stages the ParameterEscape tests drive,
# and the one place the conventions of Negative/ and Positive/ are written down.
#
# Those two directories hold one file per escape kind, and every one of them
# runs the same three stages -- extract, link, analyze -- and then asserts the
# whole verdict. Substitutions rather than per-file DEFINE blocks, because a
# DEFINE block repeated two dozen times is two dozen places for the pipeline to
# drift.
#
# How those files are written, and why:
#
#  * the verdict is asserted leaf by leaf against literals, with the closing
#    `]` of each array pinning its length. A round trip through the reader
#    cannot see a writer that swapped two same-typed fields, because it is
#    closed under any transform applied to both sides; spelled-out bytes can.
#    Each file's source locations are distinct and have line != column, so a
#    transposition has nowhere to hide;
#  * the link unit's id table is asserted first, so that every `"@"` in the
#    verdict names a function rather than a number. The id assignment is
#    deterministic but is *not* USR order -- the table is only listed in USR
#    order -- so the ids are read off a measurement rather than predicted;
#  * Negative/ holds one file per EscapeReason, and covers all of them but
#    one: NonTrivialView has no producer since tracked views were deferred out
#    of M1 (#34), and EscapeReasons.def says so. A file asserting that reason
#    cannot pass, so there is none. Every other reason in the .def has a file;
#    if a reason is added there, a file belongs here;
#  * TU-summary assertions never name an entity id. Entity numbering in a TU
#    summary is not stable run to run (see determinism.cpp), so those files use
#    exact counts and content anchors instead.
#
# Inserted at position 0 so that lit expands them before the substitutions they
# themselves contain (%clang_cc1), which are appended later in the list.
config.substitutions.insert(
    0, ("%{pe-extract}", "%clang_cc1 -fsyntax-only "
                         "--ssaf-extract-summaries=ParameterEscape "
                         "--ssaf-compilation-unit-id=cu"))
config.substitutions.insert(
    1, ("%{pe-link}", "clang-ssaf-linker"))
config.substitutions.insert(
    2, ("%{pe-analyze}", "clang-ssaf-analyzer -a NonEscapingParametersResult"))

# The escape-corpus validator's own logic, for escape-corpus-validator.test.
#
# `validate_escape_corpus.py` is the milestone's only external oracle, and its
# only other entry point is a ninja target that cannot run in a build without
# compiler-rt. This makes the review loop exercise its guards wherever *some*
# compiler on the machine can link an AddressSanitizer program.
#
# The clang under test is tried first, so that on a build with compiler-rt this
# measures the compiler this tree produced; a host compiler is the fallback
# rather than the default.
import os
import subprocess
import tempfile

import lit.util

config.substitutions.append(
    ("%{validator}",
     os.path.join(config.clang_src_dir, "utils", "ssaf",
                  "validate_escape_corpus.py")))


def _links_asan(cc):
    if not cc:
        return False
    with tempfile.TemporaryDirectory() as td:
        src = os.path.join(td, "probe.c")
        with open(src, "w") as f:
            f.write("int main(void) { return 0; }\n")
        cmd = [cc, "-fsanitize=address", "-x", "c", src,
               "-o", os.path.join(td, "probe")]
        sdk = config.environment.get("SDKROOT")
        if sdk:
            cmd += ["-isysroot", sdk]
        try:
            return subprocess.run(cmd, capture_output=True).returncode == 0
        except OSError:
            return False


for _cc in [config.clang,
            lit.util.which("clang", config.environment.get("PATH", "")),
            lit.util.which("cc", config.environment.get("PATH", ""))]:
    if _links_asan(_cc):
        config.available_features.add("asan-capable-compiler")
        config.substitutions.append(("%{asan-clang}", _cc))
        break
